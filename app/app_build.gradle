plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.aventure.desdice'
    compileSdk 34

    defaultConfig {
        applicationId "com.aventure.desdice.auto"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // Couvre les appareils recents (arm64) et les emulateurs (x86_64).
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Le build "debug" est celui produit par le workflow GitHub Actions.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            install("flask")
            // Utilisee par image_utils.py pour redimensionner/compresser
            // les images de fond et de totems trop lourdes (photos prises
            // au telephone) avant de les afficher ou de les sauvegarder.
            install("pillow")
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
